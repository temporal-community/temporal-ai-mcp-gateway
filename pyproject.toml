[project]
name = "durable-mcp-gateway"
version = "0.1.0"
description = "An MCP gateway that allows durable composition of MCP servers via Temporal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.0",
    "temporalio>=1.27.2",
    "pydantic-monty>=0.0.18",
    "pydantic>=2.13.4",
    "jsonschema>=4.0.0",
    # The out-of-band connect CLI runs a loopback HTTP server for the OAuth redirect.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
durable-mcp-gateway = "durable_mcp_gateway.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stdio", "durable_mcp_gateway"]

[tool.ruff.lint]
# Errors only: syntax, undefined names, unused imports and variables (pyflakes).
# No style or import-order rules, so `ruff check` flags bugs rather than formatting.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Example scripts run in the Monty sandbox, where the gateway injects the upstream tools
# (notion_notion_fetch, ...) as functions, so they look undefined to a linter.
"examples/*.py" = ["F821"]
# Tests import pytest fixtures and then take them as arguments of the same name.
"tests/*.py" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
