[project]
name = "durable-mcp-gateway"
version = "0.1.0"
description = "An MCP gateway that allows durable composition of MCP servers via Temporal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.0",
    "temporalio>=1.27.2",
    "pydantic-monty>=0.0.18",
    "pydantic>=2.13.4",
    "jsonschema>=4.0.0",
    # The out-of-band connect CLI runs a loopback HTTP server for the OAuth redirect.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
durable-mcp-gateway = "durable_mcp_gateway.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stdio", "durable_mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
